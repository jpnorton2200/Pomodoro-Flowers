<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Alpine Garden">
    <meta name="theme-color" content="#e8f4f0">
    <title>Alpine Wildflower Garden - Pomodoro Timer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <h1>🏔️ Alpine Garden</h1>
            <button id="viewToggle" class="icon-btn">🏡</button>
        </header>

        <!-- Main Timer View -->
        <div id="timerView" class="view active">
            <div class="timer-container">
                <div id="currentFlower" class="flower-display"></div>
                
                <div class="timer-display">
                    <div id="timerText">25:00</div>
                    <div id="sessionLabel">Focus Time</div>
                </div>

                <div class="controls">
                    <button id="startBtn" class="primary-btn">Start Growing 🌱</button>
                    <button id="pauseBtn" class="secondary-btn" style="display: none;">Pause</button>
                    <button id="resetBtn" class="secondary-btn" style="display: none;">Reset</button>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Today's Flowers</span>
                        <span id="todayCount" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Total Garden</span>
                        <span id="totalCount" class="stat-value">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Garden View -->
        <div id="gardenView" class="view">
            <div class="garden-container">
                <h2>Your Alpine Wildflower Garden 🏔️</h2>
                <div id="gardenGrid" class="garden-grid"></div>
                <div id="emptyGarden" class="empty-state">
                    <p>Your mountain meadow awaits...</p>
                    <p>Complete Pomodoro sessions to grow alpine wildflowers! 🌱</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
