<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="canvas192" width="192" height="192"></canvas>
<canvas id="canvas512" width="512" height="512"></canvas>
<script>
function createIcon(size, canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    
    // Background gradient
    const gradient = ctx.createLinearGradient(0, 0, size, size);
    gradient.addColorStop(0, '#fef6f0');
    gradient.addColorStop(0.5, '#f0e6f6');
    gradient.addColorStop(1, '#e6f4f1');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, size, size);
    
    // Draw a simple flower
    const centerX = size / 2;
    const centerY = size / 2;
    const petalRadius = size / 5;
    
    // Stem
    ctx.strokeStyle = '#2D5016';
    ctx.lineWidth = size / 30;
    ctx.beginPath();
    ctx.moveTo(centerX, centerY + petalRadius);
    ctx.lineTo(centerX, size * 0.8);
    ctx.stroke();
    
    // Leaves
    ctx.fillStyle = '#4A7C3C';
    ctx.beginPath();
    ctx.ellipse(centerX - size / 8, centerY + petalRadius / 2, size / 10, size / 20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(centerX + size / 8, centerY + petalRadius / 2, size / 10, size / 20, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Petals
    const petalColors = ['#FFB6C1', '#E6E6FA', '#B0E0E6', '#FFE4B5', '#98FB98'];
    for (let i = 0; i < 5; i++) {
        const angle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
        const x = centerX + Math.cos(angle) * petalRadius;
        const y = centerY + Math.sin(angle) * petalRadius;
        
        ctx.fillStyle = petalColors[i];
        ctx.beginPath();
        ctx.ellipse(x, y, petalRadius * 0.6, petalRadius * 0.8, angle, 0, Math.PI * 2);
        ctx.fill();
    }
    
    // Center
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(centerX, centerY, petalRadius * 0.4, 0, Math.PI * 2);
    ctx.fill();
}

createIcon(192, 'canvas192');
createIcon(512, 'canvas512');

// Download links
setTimeout(() => {
    const canvas192 = document.getElementById('canvas192');
    const canvas512 = document.getElementById('canvas512');
    
    canvas192.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'icon-192.png';
        a.textContent = 'Download 192x192 icon';
        document.body.appendChild(a);
        document.body.appendChild(document.createElement('br'));
    });
    
    canvas512.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'icon-512.png';
        a.textContent = 'Download 512x512 icon';
        document.body.appendChild(a);
    });
}, 100);
</script>
</body>
</html>
